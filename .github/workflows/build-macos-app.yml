name: Build local macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-local-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package macOS arm64 app
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-14-rust-1.96.0-local-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-14-rust-1.96.0-local-

      - name: Build self-contained app
        run: |
          ./scripts/bundle.sh release
          codesign --verify --deep --strict --verbose=2 target/release/Waku.app
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/Waku.app \
            Waku-macos-arm64.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Waku-macos-arm64
          path: Waku-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
